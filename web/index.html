  <style>
    /* Loading screen with your brand */
    body {
      background-color: #0A3D62;
      margin: 0;
      padding: 0;
    }
    #loading {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    #loading h1 {
      font-size: 18px;
      margin-bottom: 10px;
    }
    #loading p {
      font-size: 12px;
      opacity: 0.8;
    }
    .spinner {
      border: 4px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top: 4px solid white;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <script>
    // The value below is injected by flutter build, do not touch.
    var serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <!-- Loading screen shows until Flutter loads -->
  <div id="loading">
    <div class="spinner"></div>
    <h1>KAGADI MOBILE MARKET<br>AND SERVICES CENTRE</h1>
    <p>WE DELIVER IN ALL PARTS OF KAGADI AND OTHER COUNTRY AREAS<br>
    WE ARE TRUSTED BY ALL BUSINESSES IN KAGADI AND BEYOND<br><br>
    Loading real-time market...<br>
  </p> 
  </div>

  <script>
    window.addEventListener('load', function(ev) {
      // Hide loading when Flutter starts
      var loading = document.querySelector('#loading');
      
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            loading.style.display = 'none';
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
  </html>
